name: Build

on:
  push:
    branches: [ main, master, modernize-runtime, vhive-compatible, cri-native-snapshot-restore, damon-virtio-pmem ]
  pull_request:
    branches: [ main, master, modernize-runtime, vhive-compatible, cri-native-snapshot-restore, damon-virtio-pmem ]

jobs:
  build:
    permissions:
      contents: read
    env:
      GO111MODULE: on

    strategy:
      matrix:
        os: ['ubuntu-24.04']
        go: ['1.26.11']
      # Build all variants regardless of failures
      fail-fast: false

    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # By default, the checkout action only fetches the last commit,
          # but we want to run DCO check against all commit messages.
          # Assuming that a pull request may have multiple commits,
          # fetching the single commit doesn't work for us.
          #
          # While DCO check (on Makefile) checks latest 20 commits,
          # the checkout action automatically creates a merge commit
          # for merging "main" into a pull request branch.
          # In addition to that, Git cannot recognize merge commits when
          # one of the parents is missing.
          # So, we will fetch 30 commits just in case to have
          # 20 actual commits with associated merged commits.
          fetch-depth: 30
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          # Disable Go caching feature when compiling across Linux distributions due to collisions until https://github.com/actions/setup-go/issues/368 is resolved.
          cache: false
      - run: make
      - run: make lint
      - name: make test
        run: |
          set +e
          DISABLE_ROOT_TESTS=1 make test 2>&1 | tee "$RUNNER_TEMP/go-tests-user.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 tools/modernize/annotate-go-test-failures.py "$RUNNER_TEMP/go-tests-user.log" || true
          fi
          exit "$status"
      - name: make test as root
        run: |
          set +e
          EXTRAGOARGS='-exec sudo' make test 2>&1 | tee "$RUNNER_TEMP/go-tests-root.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 tools/modernize/annotate-go-test-failures.py "$RUNNER_TEMP/go-tests-root.log" || true
          fi
          exit "$status"
      - run: |
          make tidy
          git diff --exit-code
      - run: |
          make proto
          make -C cri generate
          git diff --exit-code
