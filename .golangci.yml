version: "2"
linters:
  default: none
  settings:
    goconst:
      # Repeated literal fixtures and expected event names keep tests readable.
      ignore-tests: true
  enable:
    - copyloopvar
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unconvert
  exclusions:
    generated: lax
    rules:
      - linters:
          - govet
        text: copylocks
      - linters:
          - staticcheck
        text: Do not rely on the global seed
      - path: (.+)\.go$
        text: G104
      - path: (.+)\.go$
        text: G103
      - path: (.+)\.go$
        text: G114
      - path: (.+)\.go$
        text: G115
      - path: (.+)\.go$
        text: G204
      - path: (.+)\.go$
        text: G301
      - path: (.+)\.go$
        text: G304
      - path: (.+)\.go$
        text: G306
      - path: (.+)\.go$
        text: G307
      - path: (.+)\.go$
        text: G404
    paths:
      - _submodules
      - snapshotter/internal/integtest/stargz
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - _submodules
      - snapshotter/internal/integtest/stargz
      - third_party$
      - builtin$
      - examples$
