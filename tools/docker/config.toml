imports = ["/etc/containerd/snapshotter/*.toml", "/etc/containerd/cri/*.toml"]
version = 4
[plugins."io.containerd.server.v1.grpc"]
  address = "/run/firecracker-containerd/containerd.sock"
[plugins."io.containerd.server.v1.ttrpc"]
  address = "/run/firecracker-containerd/containerd.sock.ttrpc"

[proxy_plugins]
  [proxy_plugins.demux]
    type = "snapshot"
    address = "/var/lib/demux-snapshotter/snapshotter.sock"
